name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    name: API (Node.js) — typecheck + tests
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: server } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: server/package-lock.json }
      - run: npm ci
      - run: npx tsc --noEmit -p .
      - run: npm test

  ai-service:
    name: AI service (Python) — unit tests
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: ai-service } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      # Solvers + tabular ML only; the vision model (Keras/torch) is not needed for the unit tests.
      - run: pip install numpy pandas scikit-learn lightgbm ortools fastapi pydantic httpx joblib
      - run: python -m unittest discover -s tests -t . -v

  frontend:
    name: Web (Next.js) — typecheck + build
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      # Route/layout prop types (LayoutProps, PageProps) are generated, not committed.
      - run: npx next typegen
      - run: npx tsc --noEmit -p .
      - run: npx next build
